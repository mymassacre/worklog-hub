name: worklog-hub-jira-lab

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jira
      POSTGRES_DB: jira
      # Только синтетический локальный стенд; это не рабочий секрет.
      POSTGRES_PASSWORD: jira-lab-local-only
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U jira -d jira"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1
    restart: "no"

  jira:
    image: atlassian/jira-software:10.3.9-ubuntu-jdk17
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      ATL_JDBC_URL: jdbc:postgresql://postgres:5432/jira
      ATL_JDBC_USER: jira
      ATL_JDBC_PASSWORD: jira-lab-local-only
      ATL_DB_DRIVER: org.postgresql.Driver
      ATL_DB_TYPE: postgres72
      JVM_MINIMUM_MEMORY: 512m
      JVM_MAXIMUM_MEMORY: 1536m
      JVM_RESERVED_CODE_CACHE_SIZE: 256m
      ATL_TOMCAT_ACCESS_LOGS_MAXDAYS: 2
    volumes:
      - jira-home:/var/atlassian/application-data/jira
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 3g
    cpus: 2
    restart: "no"

volumes:
  postgres-data:
  jira-home:
